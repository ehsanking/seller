<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELLER Storefront — Bootstrap 5 Starter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
    .hero-banner { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #fff; padding: 60px 0; border-radius: 16px; }
    .product-card { border: 1px solid #e2e8f0; border-radius: 12px; transition: transform 0.2s ease; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="container py-4">
    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
      <a href="/" class="d-flex items-center text-dark text-decoration-none fw-bold fs-4">
        <span class="text-primary me-2">SELLER</span> Headless Store
      </a>
      <button class="btn btn-primary btn-sm rounded-pill px-3">Cart (0)</button>
    </header>

    <!-- Hero -->
    <div class="hero-banner text-center mb-5">
      <h1 class="fw-bold display-5">Next-Gen Commerce Core</h1>
      <p class="lead text-light opacity-75">Seamlessly powered by SELLER Headless API (PHP 8.2 / Laravel 11)</p>
      <a href="#products" class="btn btn-light btn-lg font-weight-bold px-4 rounded-pill">Shop Products</a>
    </div>

    <!-- Products Grid -->
    <div id="products" class="row g-4">
      <!-- Dynamically populated via SELLER REST API endpoint: /api/products -->
    </div>
  </div>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch('http://localhost:3000/api/products');
        const products = await res.json();
        const container = document.getElementById('products');
        container.innerHTML = products.map(p => `
          <div class="col-md-4">
            <div class="card product-card p-3 h-100">
              <h5 class="fw-bold">${p.title}</h5>
              <p class="text-muted small">${p.category}</p>
              <div class="d-flex justify-content-between align-items-center mt-auto">
                <span class="fw-bold fs-5 text-primary">$${p.price.toFixed(2)}</span>
                <button class="btn btn-outline-dark btn-sm rounded-pill">Add to Cart</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch(e) {
        console.error(e);
      }
    }
    loadProducts();
  </script>
</body>
</html>
