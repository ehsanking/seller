<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELLER Storefront — Bootstrap 5 Starter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
    .hero-banner { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #fff; padding: 60px 0; border-radius: 16px; }
    .product-card { border: 1px solid #e2e8f0; border-radius: 12px; transition: transform 0.2s ease; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="container py-4">
    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
      <a href="/" class="d-flex items-center text-dark text-decoration-none fw-bold fs-4">
        <span class="text-primary me-2">SELLER</span> Headless Store
      </a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-danger btn-sm rounded-pill px-3 d-flex align-items-center gap-1" id="wishlist-badge">
          <span>♥ Wishlist</span>
          <span class="badge bg-danger rounded-circle ms-1" id="wishlist-count">0</span>
        </button>
        <button class="btn btn-primary btn-sm rounded-pill px-3">Cart (0)</button>
      </div>
    </header>

    <!-- Hero -->
    <div class="hero-banner text-center mb-5">
      <h1 class="fw-bold display-5">Next-Gen Commerce Core</h1>
      <p class="lead text-light opacity-75">Seamlessly powered by SELLER Headless API (PHP 8.2 / Laravel 11)</p>
      <a href="#products" class="btn btn-light btn-lg font-weight-bold px-4 rounded-pill">Shop Products</a>
    </div>

    <!-- Products Grid -->
    <div id="products" class="row g-4">
      <!-- Dynamically populated via SELLER REST API endpoint: /api/products -->
    </div>
  </div>

  <script>
    let wishlistSet = new Set();
    let productsList = [];

    async function loadWishlist() {
      try {
        const res = await fetch('/api/wishlist');
        const wishlistIds = await res.json();
        if (Array.isArray(wishlistIds)) {
          wishlistSet = new Set(wishlistIds);
          updateWishlistBadge();
        }
      } catch (e) {
        console.error('Error fetching wishlist:', e);
      }
    }

    function updateWishlistBadge() {
      const badge = document.getElementById('wishlist-count');
      if (badge) {
        badge.textContent = wishlistSet.size;
      }
    }

    async function loadProducts() {
      try {
        await loadWishlist();
        const res = await fetch('/api/products');
        productsList = await res.json();
        renderProducts();
      } catch(e) {
        console.error('Error loading products:', e);
      }
    }

    function renderProducts() {
      const container = document.getElementById('products');
      if (!container) return;
      container.innerHTML = productsList.map(p => {
        const isWishlisted = wishlistSet.has(p.id);
        const wishlistBtnClass = isWishlisted ? 'btn-danger' : 'btn-outline-danger';
        const wishlistBtnText = isWishlisted ? '♥ Saved' : '♡ Save to Wishlist';
        
        return `
          <div class="col-md-4">
            <div class="card product-card p-3 h-100 d-flex flex-column">
              ${p.image ? `<img src="${p.image}" alt="${p.title}" class="card-img-top rounded-3 mb-3" style="height: 180px; object-fit: cover;">` : ''}
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="fw-bold mb-0">${p.title}</h5>
                <button 
                  onclick="toggleWishlist('${p.id}')" 
                  id="wishlist-btn-${p.id}"
                  class="btn ${wishlistBtnClass} btn-sm rounded-pill px-2.5 shrink-0 ms-2"
                  title="Save to Wishlist"
                >
                  ${wishlistBtnText}
                </button>
              </div>
              <p class="text-muted small">${p.category}</p>
              <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
                <span class="fw-bold fs-5 text-primary">$${Number(p.price).toFixed(2)}</span>
                <button class="btn btn-outline-dark btn-sm rounded-pill">Add to Cart</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleWishlist(productId) {
      try {
        const res = await fetch('/api/wishlist/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId })
        });
        const data = await res.json();
        if (data.success && Array.isArray(data.wishlist)) {
          wishlistSet = new Set(data.wishlist);
          updateWishlistBadge();
          
          // Update button style & text dynamically
          const btn = document.getElementById(`wishlist-btn-${productId}`);
          if (btn) {
            const isWishlisted = wishlistSet.has(productId);
            btn.className = `btn ${isWishlisted ? 'btn-danger' : 'btn-outline-danger'} btn-sm rounded-pill px-2.5 shrink-0 ms-2`;
            btn.innerHTML = isWishlisted ? '♥ Saved' : '♡ Save to Wishlist';
          }
        }
      } catch (e) {
        console.error('Error toggling wishlist:', e);
      }
    }

    loadProducts();
  </script>
</body>
</html>
